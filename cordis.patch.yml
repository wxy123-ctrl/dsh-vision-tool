# dsh-vision-tool 的 bundle 补丁：向 Loader 插入一行宿主插件。
# 经 plugin_manager install_bundle（target=本目录绝对路径）安装，
# 或 Web 侧 Plugins 页 / `dsh plugin` 安装；行 config（识图模型路由、
# 「+ 识图」孪生开关的 base 层）可在 profile 的 cordis.patch.yml 按
# id: vision-tool 覆盖。
#
# name 用裸包名：profile 以 link 依赖挂载本目录后，裸包名经 profile 的
# node_modules 解析回本目录，随 bundle 安装自动生效。
#
# 本地开发热更技巧（选读，无需提交）：若部署的 hmr root 为 []（模块
# 文件监听关闭），Loader 停用/启用会复用 Node ESM 按 URL 命中的缓存——
# 裸包名解析出的 URL 恒定，改 index.js 后要等 DSH 重启。本地可把 name
# 改成 file:///<本目录绝对路径>/index.js?t=<N>（file: URL 不经过补丁层
# 的相对路径锚定，`?` 不会被编码成 `%3F`，?t= 使 URL 每次改码后唯一），
# 修改 index.js → 递增 t → plugin_manager set_bundle 停用再启用，即可
# 不重启 DSH 加载新代码。卸载时整个补丁层随 remove_bundle 消失，不留孤儿行。
- insert:
    - id: vision-tool
      name: dsh-vision-tool
